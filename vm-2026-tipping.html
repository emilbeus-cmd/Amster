<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VM 2026 Tippekonkurranse</title>
    <style>
:root {
  --deloitte-black: #000000;
  --deloitte-green: #86bc25;
  --deloitte-green-dark: #5f8f12;
  --deloitte-green-soft: #eff8e5;
  --deloitte-gray-900: #101010;
  --deloitte-gray-700: #333333;
  --deloitte-gray-500: #666666;
  --deloitte-gray-200: #d8d8d8;
  --deloitte-gray-100: #f5f5f5;
  --white: #ffffff;
  color: var(--deloitte-black);
  background: var(--deloitte-black);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-width: 320px;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}

main {
  width: min(1500px, calc(100% - 32px));
  margin: 0 auto;
  padding: 32px 0 56px;
}

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 24px;
  align-items: stretch;
  padding: 42px;
  border: 1px solid #222;
  border-radius: 0;
  color: var(--white);
  background:
    radial-gradient(circle at 82% 12%, rgba(134, 188, 37, 0.42), transparent 26%),
    linear-gradient(135deg, #000 0%, #0b0b0b 58%, #1f2b12 100%);
  box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
}

.hero h1 {
  max-width: 980px;
  margin: 0;
  font-size: clamp(2.2rem, 5vw, 5.4rem);
  letter-spacing: -0.07em;
  line-height: 0.95;
}

.hero p:not(.eyebrow) {
  max-width: 820px;
  color: rgba(255, 255, 255, 0.76);
  font-size: 1.12rem;
  line-height: 1.7;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--deloitte-green);
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.status-card,
.panel,
.predict-card,
.table-card,
.team-settings-card,
.knockout-match {
  border: 1px solid var(--deloitte-gray-200);
  background: var(--white);
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.14);
}

.status-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 26px;
  color: var(--deloitte-black);
  border-color: var(--deloitte-green);
}

.status-card span {
  font-size: 3rem;
  font-weight: 950;
  letter-spacing: -0.08em;
}

.status-card strong {
  margin-bottom: 12px;
}

.status-card small {
  color: var(--deloitte-gray-700);
  line-height: 1.4;
}

.status-card button,
.group-nav button,
.group-tabs button,
.knockout-match button {
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}

.status-card button,
.group-nav button {
  margin-top: 12px;
  border: 1px solid var(--deloitte-green);
  padding: 12px 16px;
  color: var(--deloitte-black);
  background: var(--deloitte-green);
  font-weight: 900;
}

.status-card button:hover,
.group-nav button:hover:not(:disabled),
.group-tabs button:hover {
  transform: translateY(-1px);
}

.panel {
  margin-top: 24px;
  padding: 28px;
}

.section-heading,
.card-heading {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: end;
  margin-bottom: 22px;
}

.section-heading h2,
.card-heading h3 {
  margin: 0;
  font-size: clamp(1.7rem, 3vw, 2.6rem);
  letter-spacing: -0.05em;
}

.card-heading h3 {
  font-size: 1.6rem;
}

.section-heading p:last-child {
  max-width: 580px;
  margin: 0;
  color: var(--deloitte-gray-500);
  line-height: 1.6;
}

.group-tabs {
  display: grid;
  grid-template-columns: repeat(12, minmax(72px, 1fr));
  gap: 8px;
  margin-bottom: 20px;
}

.group-tabs button {
  display: grid;
  gap: 3px;
  border: 1px solid var(--deloitte-gray-200);
  padding: 12px 8px;
  color: var(--deloitte-gray-900);
  background: var(--deloitte-gray-100);
  text-align: left;
}

.group-tabs button.active {
  border-color: var(--deloitte-green);
  background: var(--deloitte-green);
  color: var(--deloitte-black);
}

.group-tabs strong {
  font-size: 1.25rem;
  line-height: 1;
}

.group-tabs span {
  color: inherit;
  font-size: 0.78rem;
  font-weight: 800;
}

.active-group-layout {
  display: grid;
  grid-template-columns: minmax(360px, 1.15fr) minmax(430px, 1fr);
  gap: 18px;
  align-items: start;
}

.predict-card,
.table-card,
.team-settings-card {
  padding: 20px;
}

.table-card {
  position: sticky;
  top: 16px;
}

.team-settings-card {
  grid-column: 1 / -1;
}

.group-nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.group-nav button {
  margin: 0;
  background: var(--deloitte-black);
  color: var(--white);
  border-color: var(--deloitte-black);
}

.group-nav button:last-child {
  background: var(--deloitte-green);
  color: var(--deloitte-black);
  border-color: var(--deloitte-green);
}

input {
  width: 100%;
  border: 1px solid var(--deloitte-gray-200);
  padding: 10px 12px;
  color: var(--deloitte-black);
  background: var(--white);
}

input:focus {
  border-color: var(--deloitte-green);
  outline: 3px solid rgba(134, 188, 37, 0.24);
}

.matches {
  display: grid;
  gap: 12px;
}

.match-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 54px 18px 54px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 14px;
  border-left: 5px solid var(--deloitte-green);
  background: var(--deloitte-gray-100);
  font-size: 0.95rem;
}

.match-row span:first-child {
  text-align: right;
}

.match-row input {
  padding: 10px 4px;
  text-align: center;
  font-weight: 900;
}

.dash {
  color: var(--deloitte-gray-500);
  text-align: center;
  font-weight: 900;
}

.team-settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 10px;
}

.team-setting {
  display: grid;
  grid-template-columns: 44px 1fr 74px 74px;
  gap: 8px;
  align-items: center;
  padding: 10px;
  background: var(--deloitte-gray-100);
}

.team-setting span {
  color: var(--deloitte-gray-500);
  font-size: 0.85rem;
  font-weight: 900;
}

.team-setting::after {
  content: 'Fair play / rank';
  grid-column: 3 / 5;
  grid-row: 2;
  color: var(--deloitte-gray-500);
  font-size: 0.68rem;
  text-transform: uppercase;
}

table {
  width: 100%;
  border-collapse: collapse;
  overflow: hidden;
  font-size: 0.9rem;
}

th,
td {
  padding: 10px 8px;
  border-bottom: 1px solid #ececec;
  text-align: left;
  vertical-align: top;
}

th:not(:nth-child(2)),
td:not(:nth-child(2)) {
  text-align: center;
}

th {
  color: var(--white);
  background: var(--deloitte-black);
  font-size: 0.74rem;
  text-transform: uppercase;
}

td:last-child {
  max-width: 180px;
  color: var(--deloitte-gray-500);
  font-size: 0.78rem;
  line-height: 1.35;
  text-align: left;
}

.qualified td:first-child,
.third td:first-child {
  position: relative;
  font-weight: 900;
}

.qualified td:first-child::before,
.third td:first-child::before {
  content: '';
  display: inline-block;
  width: 9px;
  height: 9px;
  margin-right: 8px;
  border-radius: 50%;
  background: var(--deloitte-green);
}

.third td:first-child::before {
  background: var(--deloitte-black);
}

.legend {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--deloitte-gray-500);
  font-size: 0.78rem;
  font-weight: 800;
}

.legend i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--deloitte-green);
}

.legend i:last-child {
  background: var(--deloitte-black);
}

.rules-panel {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 24px;
  background: var(--deloitte-green-soft);
  border-color: var(--deloitte-green);
}

.rules-panel h2 {
  margin: 0;
  letter-spacing: -0.05em;
}

.rules-panel ol {
  margin: 0;
  columns: 2;
  color: var(--deloitte-gray-700);
  line-height: 1.6;
}

.bracket {
  display: grid;
  grid-template-columns: repeat(5, minmax(220px, 1fr));
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.round {
  min-width: 220px;
}

.round h3 {
  margin: 0 0 14px;
  letter-spacing: -0.03em;
}

.knockout-match {
  display: grid;
  gap: 8px;
  margin-bottom: 12px;
  padding: 12px;
}

.knockout-match small {
  color: var(--deloitte-gray-500);
  font-weight: 900;
}

.knockout-match button {
  display: grid;
  gap: 2px;
  width: 100%;
  border: 1px solid var(--deloitte-gray-200);
  padding: 10px;
  text-align: left;
  color: var(--deloitte-black);
  background: var(--white);
}

.knockout-match button:not(:disabled):hover,
.knockout-match button.selected {
  border-color: var(--deloitte-green);
  background: var(--deloitte-green-soft);
}

.knockout-match span {
  font-weight: 900;
}

.knockout-match em {
  color: var(--deloitte-gray-500);
  font-size: 0.74rem;
  font-style: normal;
}

@media (max-width: 1050px) {
  .hero,
  .active-group-layout,
  .rules-panel {
    grid-template-columns: 1fr;
  }

  .table-card {
    position: static;
  }

  .group-tabs {
    grid-template-columns: repeat(6, 1fr);
  }

  .rules-panel ol {
    columns: 1;
  }
}

@media (max-width: 680px) {
  main {
    width: min(100% - 20px, 1500px);
    padding-top: 10px;
  }

  .hero,
  .panel {
    padding: 22px;
  }

  .section-heading,
  .card-heading {
    display: block;
  }

  .group-tabs {
    grid-template-columns: repeat(3, 1fr);
  }

  .match-row {
    grid-template-columns: 1fr 42px 10px 42px 1fr;
    padding: 10px;
    font-size: 0.82rem;
  }

  .team-setting {
    grid-template-columns: 38px 1fr;
  }

  .team-setting::after {
    grid-column: 1 / -1;
  }
}

    </style>

  <body>
    <div id="root"></div>
    <script>
const roundLabels = {
  round32: '1/16-finaler',
  round16: '1/8-finaler',
  quarter: 'Kvartfinaler',
  semi: 'Semifinaler',
  final: 'Finale',
}

const groupIds = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L']

const groupTeamNames = {
  A: ['Mexico', 'South Africa', 'Korea Republic', 'Czechia'],
  B: ['Canada', 'Bosnia and Herzegovina', 'Qatar', 'Switzerland'],
  C: ['Brazil', 'Morocco', 'Haiti', 'Scotland'],
  D: ['USA', 'Paraguay', 'Australia', 'Türkiye'],
  E: ['Germany', 'Curaçao', "Côte d'Ivoire", 'Ecuador'],
  F: ['Netherlands', 'Japan', 'Sweden', 'Tunisia'],
  G: ['Belgium', 'Egypt', 'IR Iran', 'New Zealand'],
  H: ['Spain', 'Cabo Verde', 'Saudi Arabia', 'Uruguay'],
  I: ['France', 'Senegal', 'Iraq', 'Norway'],
  J: ['Argentina', 'Algeria', 'Austria', 'Jordan'],
  K: ['Portugal', 'Congo DR', 'Uzbekistan', 'Colombia'],
  L: ['England', 'Croatia', 'Ghana', 'Panama'],
}

const teams = groupIds.flatMap((group) =>
  groupTeamNames[group].map((name, index) => ({
    id: `${group}${index + 1}`,
    name,
    group,
  })),
)

const teamById = new Map(teams.map((team) => [team.id, team]))

const groupMatches = groupIds.flatMap((group) => {
  const groupTeams = teams.filter((team) => team.group === group)
  const pairings = [
    [0, 1],
    [2, 3],
    [0, 2],
    [1, 3],
    [0, 3],
    [1, 2],
  ]

  return pairings.map(([homeIndex, awayIndex], matchIndex) => ({
    id: `${group}-${matchIndex + 1}`,
    group,
    home: groupTeams[homeIndex].id,
    away: groupTeams[awayIndex].id,
  }))
})

const emptyRow = (team, meta) => ({
  team,
  played: 0,
  won: 0,
  drawn: 0,
  lost: 0,
  goalsFor: 0,
  goalsAgainst: 0,
  goalDifference: 0,
  points: 0,
  headToHeadNote: '',
  conductScore: Number(meta?.conductScore === '' ? 0 : (meta?.conductScore ?? 0)),
  fifaRank: Number(meta?.fifaRank === '' ? 999 : (meta?.fifaRank ?? 999)),
})

const parseScore = (value) => {
  if ((value ?? '').trim() === '') return null
  const parsed = Number(value)
  if (!Number.isInteger(parsed) || parsed < 0) return null
  return parsed
}

function hasValidPrediction(prediction) {
  return Boolean(prediction && parseScore(prediction.home) !== null && parseScore(prediction.away) !== null)
}

function compareRows(a, b) {
  if (!a && !b) return 0
  if (!a) return 1
  if (!b) return -1

  return (
    b.points - a.points ||
    b.goalDifference - a.goalDifference ||
    b.goalsFor - a.goalsFor ||
    b.conductScore - a.conductScore ||
    a.fifaRank - b.fifaRank ||
    a.team.name.localeCompare(b.team.name, 'nb')
  )
}

function calculateTables(predictions, teamNames = {}, teamMeta = {}) {
  return Object.fromEntries(
    groupIds.map((group) => {
      const rows = new Map(
        teams
          .filter((team) => team.group === group)
          .map((team) => [
            team.id,
            emptyRow({ ...team, name: teamNames[team.id] || team.name }, teamMeta[team.id]),
          ]),
      )
      const matches = groupMatches.filter((match) => match.group === group)

      matches.forEach((match) => {
        const prediction = predictions[match.id]
        const homeGoals = parseScore(prediction?.home ?? '')
        const awayGoals = parseScore(prediction?.away ?? '')

        if (homeGoals === null || awayGoals === null) return

        const homeRow = rows.get(match.home)
        const awayRow = rows.get(match.away)
        if (!homeRow || !awayRow) return

        applyResult(homeRow, awayRow, homeGoals, awayGoals)
      })

      return [group, sortGroupRows([...rows.values()], matches, predictions)]
    }),
  )
}

function getGroupProgress(group, predictions) {
  const matches = groupMatches.filter((match) => match.group === group)
  return {
    completed: matches.filter((match) => hasValidPrediction(predictions[match.id])).length,
    total: matches.length,
  }
}

function explainTieBreaker(row, table) {
  const tiedOnPoints = table.filter((candidate) => candidate.points === row.points)
  if (tiedOnPoints.length === 1) return 'Ikke poenglikhet'
  return row.headToHeadNote || 'Sortert på total målforskjell, scorede mål, fair play og FIFA-ranking'
}

function applyResult(homeRow, awayRow, homeGoals, awayGoals) {
  homeRow.played += 1
  awayRow.played += 1
  homeRow.goalsFor += homeGoals
  homeRow.goalsAgainst += awayGoals
  awayRow.goalsFor += awayGoals
  awayRow.goalsAgainst += homeGoals

  if (homeGoals > awayGoals) {
    homeRow.won += 1
    awayRow.lost += 1
    homeRow.points += 3
  } else if (homeGoals < awayGoals) {
    awayRow.won += 1
    homeRow.lost += 1
    awayRow.points += 3
  } else {
    homeRow.drawn += 1
    awayRow.drawn += 1
    homeRow.points += 1
    awayRow.points += 1
  }

  homeRow.goalDifference = homeRow.goalsFor - homeRow.goalsAgainst
  awayRow.goalDifference = awayRow.goalsFor - awayRow.goalsAgainst
}

function sortGroupRows(rows, matches, predictions) {
  const byPoints = rows.reduce((groups, row) => {
    const pointRows = groups.get(row.points) ?? []
    pointRows.push(row)
    groups.set(row.points, pointRows)
    return groups
  }, new Map())
  return [...byPoints.keys()]
    .sort((a, b) => b - a)
    .flatMap((points) => sortPointTie(byPoints.get(points), matches, predictions))
}

function sortPointTie(rows, matches, predictions) {
  if (rows.length <= 1) return rows

  const concernedIds = new Set(rows.map((row) => row.team.id))
  const headToHead = new Map(rows.map((row) => [row.team.id, emptyRow(row.team, row)]))

  matches.forEach((match) => {
    if (!concernedIds.has(match.home) || !concernedIds.has(match.away)) return
    const prediction = predictions[match.id]
    const homeGoals = parseScore(prediction?.home ?? '')
    const awayGoals = parseScore(prediction?.away ?? '')
    if (homeGoals === null || awayGoals === null) return
    applyResult(headToHead.get(match.home), headToHead.get(match.away), homeGoals, awayGoals)
  })

  const h2hLabel = rows.length === 2 ? 'Innbyrdes oppgjør' : `Innbyrdes tabell mellom ${rows.length} lag`

  return rows.sort((a, b) => {
    const h2hA = headToHead.get(a.team.id)
    const h2hB = headToHead.get(b.team.id)
    const h2hResult = compareHeadToHeadRows(h2hA, h2hB)
    if (h2hResult !== 0) {
      a.headToHeadNote = h2hLabel
      b.headToHeadNote = h2hLabel
      return h2hResult
    }

    a.headToHeadNote = 'Innbyrdes likt – bruker totalstatistikk'
    b.headToHeadNote = 'Innbyrdes likt – bruker totalstatistikk'
    return compareRows(a, b)
  })
}

function compareHeadToHeadRows(a, b) {
  return b.points - a.points || b.goalDifference - a.goalDifference || b.goalsFor - a.goalsFor
}

function buildQualifiers(tables) {
  const firstAndSecond = groupIds.flatMap((group) => [
    {
      seed: `${group}1`,
      source: `Vinner gruppe ${group}`,
      team: tables[group][0]?.team ?? null,
      stats: tables[group][0],
    },
    {
      seed: `${group}2`,
      source: `Toer gruppe ${group}`,
      team: tables[group][1]?.team ?? null,
      stats: tables[group][1],
    },
  ])

  const thirdPlaced = groupIds
    .map((group) => ({
      seed: `${group}3`,
      source: `Treer gruppe ${group}`,
      team: tables[group][2]?.team ?? null,
      stats: tables[group][2],
    }))
    .sort((a, b) => compareRows(a.stats, b.stats))
    .slice(0, 8)
    .map((qualifier, index) => ({
      ...qualifier,
      seed: `B3-${index + 1}`,
      source: `${index + 1}. beste gruppetreer (${qualifier.source})`,
    }))

  return [...firstAndSecond, ...thirdPlaced]
}

function buildRoundOf32(qualifiers) {
  const bySeed = new Map(qualifiers.map((qualifier) => [qualifier.seed, qualifier]))
  const winners = groupIds.map((group) => bySeed.get(`${group}1`) ?? placeholder(`Vinner gruppe ${group}`))
  const runnersUp = groupIds.map((group) => bySeed.get(`${group}2`) ?? placeholder(`Toer gruppe ${group}`))
  const thirds = Array.from({ length: 8 }, (_, index) => bySeed.get(`B3-${index + 1}`) ?? placeholder(`${index + 1}. beste gruppetreer`))

  const topWinnerMatches = winners.slice(0, 8).map((winner, index) => [winner, thirds[index]])
  const remainingMatches = [
    [winners[8], runnersUp[0]],
    [winners[9], runnersUp[1]],
    [winners[10], runnersUp[2]],
    [winners[11], runnersUp[3]],
    [runnersUp[4], runnersUp[5]],
    [runnersUp[6], runnersUp[7]],
    [runnersUp[8], runnersUp[9]],
    [runnersUp[10], runnersUp[11]],
  ]

  return [...topWinnerMatches, ...remainingMatches].map(([home, away], index) => ({
    id: `R32-${index + 1}`,
    round: 'round32',
    home,
    away,
  }))
}

function buildKnockoutBracket(roundOf32, winners) {
  const matches = [...roundOf32]
  const addRound = (round, prefix, previousIds) => {
    const nextIds = []
    for (let index = 0; index < previousIds.length; index += 2) {
      const first = previousIds[index]
      const second = previousIds[index + 1]
      const id = `${prefix}-${index / 2 + 1}`
      matches.push({
        id,
        round,
        home: winnerAsQualifier(matches.find((match) => match.id === first), winners[first]),
        away: winnerAsQualifier(matches.find((match) => match.id === second), winners[second]),
        dependsOn: [first, second],
      })
      nextIds.push(id)
    }
    return nextIds
  }

  const round16 = addRound('round16', 'R16', roundOf32.map((match) => match.id))
  const quarters = addRound('quarter', 'QF', round16)
  const semis = addRound('semi', 'SF', quarters)
  addRound('final', 'F', semis)

  return matches
}

function winnerAsQualifier(match, winnerId) {
  const team = [match?.home, match?.away].find((side) => side?.team?.id === winnerId)
  return team ?? placeholder(match ? `Vinner ${match.id}` : 'Vinner kamp')
}

function placeholder(source) {
  return {
    seed: source,
    source,
    team: null,
  }
}


window.Tournament = {
  buildKnockoutBracket,
  buildQualifiers,
  buildRoundOf32,
  calculateTables,
  compareRows,
  explainTieBreaker,
  getGroupProgress,
  groupIds,
  groupMatches,
  hasValidPrediction,
  roundLabels,
  teamById,
  teams,
}

    </script>
    <script>
const {
  buildKnockoutBracket,
  buildQualifiers,
  buildRoundOf32,
  calculateTables,
  explainTieBreaker,
  getGroupProgress,
  groupIds,
  groupMatches,
  hasValidPrediction,
  roundLabels,
  teamById,
  teams,
} = window.Tournament

const STORAGE_KEY = 'vm-2026-tipping-state'

const initialState = {
  activeGroup: 'A',
  predictions: {},
  knockoutWinners: {},
  customTeamNames: Object.fromEntries(teams.map((team) => [team.id, team.name])),
  teamMeta: Object.fromEntries(teams.map((team) => [team.id, { conductScore: 0, fifaRank: 999 }])),
}

let state = loadState()

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY)
    return raw ? normalizeState({ ...initialState, ...JSON.parse(raw) }) : structuredClone(initialState)
  } catch {
    return structuredClone(initialState)
  }
}

function normalizeState(nextState) {
  return {
    ...nextState,
    activeGroup: groupIds.includes(nextState.activeGroup) ? nextState.activeGroup : 'A',
    customTeamNames: { ...initialState.customTeamNames, ...nextState.customTeamNames },
    teamMeta: { ...initialState.teamMeta, ...nextState.teamMeta },
  }
}

function persist(nextState) {
  state = normalizeState(nextState)
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state))
  render()
}

function displayName(teamId) {
  return state.customTeamNames[teamId] || teamById.get(teamId)?.name || 'Ukjent lag'
}

function setActiveGroup(group) {
  persist({ ...state, activeGroup: group })
}

function updatePrediction(matchId, side, value) {
  if (!/^\d{0,2}$/.test(value)) return
  persist({
    ...state,
    predictions: {
      ...state.predictions,
      [matchId]: {
        home: state.predictions[matchId]?.home ?? '',
        away: state.predictions[matchId]?.away ?? '',
        [side]: value,
      },
    },
    knockoutWinners: {},
  })
}

function updateTeamName(teamId, value) {
  persist({
    ...state,
    customTeamNames: {
      ...state.customTeamNames,
      [teamId]: value,
    },
    knockoutWinners: {},
  })
}

function updateTeamMeta(teamId, field, value) {
  if (value !== '' && !/^-?\d{0,4}$/.test(value)) return
  persist({
    ...state,
    teamMeta: {
      ...state.teamMeta,
      [teamId]: {
        ...state.teamMeta[teamId],
        [field]: value === '' ? '' : Number(value),
      },
    },
    knockoutWinners: {},
  })
}

function selectWinner(match, teamId, bracket) {
  const nextWinners = { ...state.knockoutWinners, [match.id]: teamId }
  const matchIndex = bracket.findIndex((candidate) => candidate.id === match.id)

  bracket.slice(matchIndex + 1).forEach((laterMatch) => {
    const validIds = [laterMatch.home?.team?.id, laterMatch.away?.team?.id]
    if (nextWinners[laterMatch.id] && !validIds.includes(nextWinners[laterMatch.id])) {
      delete nextWinners[laterMatch.id]
    }
  })

  persist({ ...state, knockoutWinners: nextWinners })
}

function goToRelativeGroup(direction) {
  const currentIndex = groupIds.indexOf(state.activeGroup)
  const nextIndex = Math.min(groupIds.length - 1, Math.max(0, currentIndex + direction))
  setActiveGroup(groupIds[nextIndex])
}

function resetAll() {
  persist(structuredClone(initialState))
}

function render() {
  const app = document.querySelector('#root')
  const tables = calculateTables(state.predictions, state.customTeamNames, state.teamMeta)
  const qualifiers = buildQualifiers(tables)
  const roundOf32 = buildRoundOf32(qualifiers)
  const bracket = buildKnockoutBracket(roundOf32, state.knockoutWinners)
  const completedGroupMatches = groupMatches.filter((match) => hasValidPrediction(state.predictions[match.id])).length
  const champion = bracket.find((match) => match.id === 'F-1')
  const championName = state.knockoutWinners['F-1'] ? displayName(state.knockoutWinners['F-1']) : 'Ikke kåret ennå'
  const activeProgress = getGroupProgress(state.activeGroup, state.predictions)

  app.innerHTML = `
    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">Deloitte · VM 2026 tippekonkurranse</p>
          <h1>Tipp én gruppe av gangen – se tabellen endre seg direkte</h1>
          <p>
            Fyll inn konkrete resultater, for eksempel 3–1 til Frankrike over Norge. Appen rangerer lagene gruppe for gruppe,
            bruker innbyrdes oppgjør der det er poenglikhet, og sender gruppevinnere, gruppetoere og de åtte beste treerne videre.
          </p>
        </div>
        <aside class="status-card">
          <span>${completedGroupMatches} / ${groupMatches.length}</span>
          <strong>gruppekamper tippet</strong>
          <small>Aktiv gruppe ${state.activeGroup}: ${activeProgress.completed}/${activeProgress.total} kamper</small>
          <small>Mester: ${escapeHtml(championName)}</small>
          ${champion?.home?.team && champion?.away?.team ? `<small>Finale: ${escapeHtml(champion.home.team.name)} – ${escapeHtml(champion.away.team.name)}</small>` : ''}
          <button data-action="reset">Nullstill demo</button>
        </aside>
      </section>

      <section class="panel group-flow-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Steg 1 og 2</p>
            <h2>Tipp hele gruppe ${state.activeGroup} før du går videre</h2>
          </div>
          <p>
            Velg gruppe i rekkefølge A–L. Tabellen til høyre oppdateres etter hvert resultat og viser hvilken tie-breaker som er i bruk.
          </p>
        </div>
        ${renderGroupTabs()}
        ${renderActiveGroup(tables[state.activeGroup])}
      </section>

      <section class="panel rules-panel">
        <div>
          <p class="eyebrow">Tie-breakere</p>
          <h2>Reglene som hensyntas</h2>
        </div>
        <ol>
          <li>Poeng i innbyrdes kamper mellom lag som står likt.</li>
          <li>Målforskjell i de innbyrdes kampene.</li>
          <li>Scorede mål i de innbyrdes kampene.</li>
          <li>Total målforskjell og deretter totalt scorede mål i gruppen.</li>
          <li>Valgfri fair play-score og FIFA-ranking kan fylles inn for å skille lag som fortsatt er like.</li>
        </ol>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Steg 3</p>
            <h2>Sluttspill</h2>
          </div>
          <p>Velg vinner i hver kamp. Neste runde fylles ut automatisk basert på valgene dine.</p>
        </div>
        <div class="bracket">
          ${['round32', 'round16', 'quarter', 'semi', 'final'].map((round) => renderRound(round, bracket)).join('')}
        </div>
      </section>
    </main>
  `

  app.querySelector('[data-action="reset"]')?.addEventListener('click', resetAll)
  app.querySelectorAll('[data-group]').forEach((button) => {
    button.addEventListener('click', (event) => setActiveGroup(event.currentTarget.dataset.group))
  })
  app.querySelectorAll('[data-group-step]').forEach((button) => {
    button.addEventListener('click', (event) => goToRelativeGroup(Number(event.currentTarget.dataset.groupStep)))
  })
  app.querySelectorAll('[data-team-input]').forEach((input) => {
    input.addEventListener('input', (event) => updateTeamName(event.target.dataset.teamInput, event.target.value))
  })
  app.querySelectorAll('[data-meta-field]').forEach((input) => {
    input.addEventListener('input', (event) => updateTeamMeta(event.target.dataset.teamId, event.target.dataset.metaField, event.target.value))
  })
  app.querySelectorAll('[data-prediction]').forEach((input) => {
    input.addEventListener('input', (event) => updatePrediction(event.target.dataset.prediction, event.target.dataset.side, event.target.value))
  })
  app.querySelectorAll('[data-winner]').forEach((button) => {
    button.addEventListener('click', (event) => {
      const match = bracket.find((candidate) => candidate.id === event.currentTarget.dataset.match)
      if (match) selectWinner(match, event.currentTarget.dataset.winner, bracket)
    })
  })
}

function renderGroupTabs() {
  return `
    <div class="group-tabs" aria-label="Velg gruppe">
      ${groupIds.map((group) => {
        const progress = getGroupProgress(group, state.predictions)
        const isActive = group === state.activeGroup
        return `
          <button class="${isActive ? 'active' : ''}" data-group="${group}" aria-pressed="${isActive}">
            <strong>${group}</strong>
            <span>${progress.completed}/${progress.total}</span>
          </button>
        `
      }).join('')}
    </div>
  `
}

function renderActiveGroup(table) {
  const groupTeams = teams.filter((team) => team.group === state.activeGroup)
  const currentIndex = groupIds.indexOf(state.activeGroup)
  return `
    <div class="active-group-layout">
      <article class="predict-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Gruppe ${state.activeGroup}</p>
            <h3>Resultattips</h3>
          </div>
          <div class="group-nav">
            <button data-group-step="-1" ${currentIndex === 0 ? 'disabled' : ''}>Forrige</button>
            <button data-group-step="1" ${currentIndex === groupIds.length - 1 ? 'disabled' : ''}>Neste gruppe</button>
          </div>
        </div>
        <div class="matches featured-matches">
          ${groupMatches.filter((match) => match.group === state.activeGroup).map(renderMatchRow).join('')}
        </div>
      </article>

      <article class="table-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Live tabell</p>
            <h3>Gruppe ${state.activeGroup}</h3>
          </div>
          <span class="legend"><i></i> videre · <i></i> mulig beste treer</span>
        </div>
        ${renderTable(table)}
      </article>

      <article class="team-settings-card">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Lag og tie-break</p>
            <h3>Juster gruppe ${state.activeGroup}</h3>
          </div>
        </div>
        <div class="team-settings-grid">
          ${groupTeams.map(renderTeamSetting).join('')}
        </div>
      </article>
    </div>
  `
}

function renderTeamSetting(team) {
  const meta = state.teamMeta[team.id] ?? { conductScore: 0, fifaRank: 999 }
  return `
    <label class="team-setting">
      <span>${team.id}</span>
      <input data-team-input="${team.id}" value="${escapeAttribute(state.customTeamNames[team.id])}" aria-label="Navn for ${team.id}" />
      <input data-team-id="${team.id}" data-meta-field="conductScore" value="${escapeAttribute(meta.conductScore)}" aria-label="Fair play-score for ${team.id}" title="Fair play-score: høyere er bedre" />
      <input data-team-id="${team.id}" data-meta-field="fifaRank" value="${escapeAttribute(meta.fifaRank)}" aria-label="FIFA-ranking for ${team.id}" title="FIFA-ranking: lavere er bedre" />
    </label>
  `
}

function renderTable(table) {
  return `
    <table>
      <thead>
        <tr><th>#</th><th>Lag</th><th>P</th><th>MF</th><th>M</th><th>Tie-break</th></tr>
      </thead>
      <tbody>
        ${table.map((row, index) => `
          <tr class="${index < 2 ? 'qualified' : index === 2 ? 'third' : ''}">
            <td>${index + 1}</td>
            <td>${escapeHtml(row.team.name)}</td>
            <td>${row.points}</td>
            <td>${row.goalDifference}</td>
            <td>${row.goalsFor}-${row.goalsAgainst}</td>
            <td>${escapeHtml(explainTieBreaker(row, table))}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `
}

function renderMatchRow(match) {
  const prediction = state.predictions[match.id] ?? { home: '', away: '' }
  return `
    <div class="match-row">
      <span>${escapeHtml(displayName(match.home))}</span>
      <input aria-label="${escapeAttribute(displayName(match.home))} mål" inputmode="numeric" data-prediction="${match.id}" data-side="home" value="${escapeAttribute(prediction.home)}" />
      <span class="dash">–</span>
      <input aria-label="${escapeAttribute(displayName(match.away))} mål" inputmode="numeric" data-prediction="${match.id}" data-side="away" value="${escapeAttribute(prediction.away)}" />
      <span>${escapeHtml(displayName(match.away))}</span>
    </div>
  `
}

function renderRound(round, bracket) {
  return `
    <div class="round">
      <h3>${roundLabels[round]}</h3>
      ${bracket.filter((match) => match.round === round).map((match) => renderKnockoutMatch(match)).join('')}
    </div>
  `
}

function renderKnockoutMatch(match) {
  return `
    <article class="knockout-match">
      <small>${match.id}</small>
      ${[match.home, match.away].map((side) => renderKnockoutSide(match, side)).join('')}
    </article>
  `
}

function renderKnockoutSide(match, side) {
  const disabled = !side?.team
  const selected = side?.team?.id === state.knockoutWinners[match.id]
  return `
    <button
      class="${selected ? 'selected' : ''}"
      ${disabled ? 'disabled' : ''}
      ${side?.team ? `data-match="${match.id}" data-winner="${side.team.id}"` : ''}
    >
      <span>${escapeHtml(side?.team?.name ?? side?.source ?? 'Venter på vinner')}</span>
      <em>${escapeHtml(side?.source ?? '')}</em>
    </button>
  `
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, (character) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    "'": '&#039;',
    '"': '&quot;',
  })[character])
}

function escapeAttribute(value = '') {
  return escapeHtml(value)
}

render()

    </script>
  </body>
</html>
